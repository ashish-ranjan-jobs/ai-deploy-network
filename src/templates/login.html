{% extends "base.html" %}

{% block title %}Sign In — AI Deploy Network{% endblock %}

{% block content %}
<div class="py-16 px-4 sm:px-6 lg:px-8 max-w-sm mx-auto">
  <div class="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-7 sm:p-8">
    
    <div class="mb-6">
      <div class="font-mono-code text-[11px] text-zinc-500 mb-1">AUTH // SESSION</div>
      <h1 class="text-xl font-bold text-white tracking-tight">Builder Sign In</h1>
      <p class="text-xs text-zinc-400 mt-1">Manage verified records and membership card.</p>
    </div>

    {% if error %}
      <div class="mb-4 p-3 rounded-md bg-red-950/40 border border-red-800/80 text-red-300 text-xs font-mono-code">
        [ERROR]: {{ error }}
      </div>
    {% endif %}

    <form action="/aideploy/login" method="POST" class="space-y-4 text-xs font-sans">
      <div>
        <label class="block text-[11px] font-mono-code text-zinc-400 mb-1">EMAIL_ADDRESS</label>
        <input type="email" name="email" required placeholder="user@domain.io"
               class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-3 py-2 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500">
      </div>

      <div>
        <label class="block text-[11px] font-mono-code text-zinc-400 mb-1">PASSWORD</label>
        <input type="password" name="password" required placeholder="Your password"
               class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-3 py-2 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-semibold py-2 px-4 rounded-md transition font-mono-code text-xs">
          AUTHENTICATE &rarr;
        </button>
      </div>

      <div class="pt-4 border-t border-zinc-800 text-center text-xs text-zinc-400 font-mono-code">
        NO ACCOUNT YET? <br>
        <a href="/aideploy/register" class="text-amber-400 hover:underline mt-1 inline-block">CLAIM FOUNDING SPOT</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
